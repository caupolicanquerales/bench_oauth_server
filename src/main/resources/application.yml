server:
  port: ${PORT:8083}
  forward-headers-strategy: framework
  shutdown: graceful

app:
  auth:
    issuer: ${ISSUER_URI:${AUTH_SERVER_ISSUER:http://localhost:8082}}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8082,https://bench-frontend.onrender.com,https://bench-api-gateway.onrender.com}

spring:
  application:
    name: bench_oauth_server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: update # Automatically creates user & OAuth tables on startup
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  pattern:
    console: "${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n}"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.capo.bench_oauth_server: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOGGING_LEVEL_OAUTH2:INFO}
    org.springframework.web: ${LOGGING_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}

---
# ------------------------------------------------------------------
# Local Environment Profile
# ------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/benchauthDB}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

---
# ------------------------------------------------------------------
# Cloud / Render Environment Profile
# ------------------------------------------------------------------
server:
  port: ${PORT:8083} # Render injects PORT dynamically
  servlet:
    session:
      cookie:
        secure: true
        same-site: "none"
        http-only: true

app:
  auth:
    issuer: ${ISSUER_URI:${AUTH_SERVER_ISSUER:https://bench-api-gateway.onrender.com}}
  frontend:
    url: ${FRONTEND_URL:https://bench-frontend.onrender.com}

spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-dak3ev142hec73bsfij0-a/dbbenchauth}
    username: ${DB_USER:dbbenchauth_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

